suite: ConfigMap and Secret tests

templates:
  - templates/configmap.tpl
  - templates/secret.tpl

tests:
  - it: should render configmap when enabled
    set:
      image.repository: nginx
      image.tag: latest
      configmap:
        enabled: true
      env:
        configMap:
          KEY1: value1
          KEY2: value2
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.KEY1
          value: value1

  - it: should not render configmap when disabled
    set:
      image.repository: nginx
      image.tag: latest
      configmap:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret when enabled
    set:
      image.repository: nginx
      image.tag: latest
      secret:
        enabled: true
      env:
        secret:
          DB_PASSWORD: supersecret
          API_KEY: myapikey
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.DB_PASSWORD
          value: supersecret

  - it: should not render secret when disabled
    set:
      image.repository: nginx
      image.tag: latest
      secret:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render both configmap and secret
    set:
      image.repository: nginx
      image.tag: latest
      configmap:
        enabled: true
      secret:
        enabled: true
      env:
        configMap:
          LOG_LEVEL: info
        secret:
          DB_PASSWORD: secret123
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        template: templates/configmap.tpl
      - isKind:
          of: Secret
        template: templates/secret.tpl
